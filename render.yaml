# Render 무료 웹 서버 설정 (New → Blueprint로 이 저장소를 고르면 읽는다)
services:
  - type: web
    name: houseplan
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: REQUIRE_LOGIN # false: 로그인 없이 연다 (주소를 아는 누구나 보고 고친다)
        value: "false"
      - key: DATABASE_URL # Neon 등 무료 Postgres 연결 주소
        sync: false
      - key: APP_PASSWORD # REQUIRE_LOGIN이 true일 때 쓸 비밀번호 (12자 이상)
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_TOKEN # GitHub Actions 시세 갱신용
        generateValue: true
